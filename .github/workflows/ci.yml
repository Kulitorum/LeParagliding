name: CI

# Builds run only for release tags (plus the manual Run-workflow button):
# ordinary pushes to main do not trigger CI.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Upload artifacts to the GitHub release'
        required: false
        default: false
        type: boolean
      platforms:
        description: 'Platforms to build: "all" or any of "linux macos windows"'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write

# Grouped by commit, not ref: pushing a branch and a tag that point at the
# same commit (the release flow) then yields one run instead of two.
# Tag/branch pushes on the same commit share a group (one run instead of
# two), but every manual dispatch gets its own group: concurrent sessions
# dispatching partial builds must not cancel each other's runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.sha }}
  cancel-in-progress: true

env:
  OCCT_TAG: V8_0_0_p1
  # secrets.* is not allowed in step-level if expressions, so surface the
  # signing capability as an env flag here.
  MAC_SIGNING: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 != '' }}
  # Needs Qt >= 6.9: older QtGui link interfaces reference the AGL framework,
  # which the macOS 26 SDK (selected via latest-stable Xcode) no longer
  # ships. 6.11.1 is not yet resolvable by aqtinstall for windows desktop
  # (its base Updates.xml is missing from the CDN), so pin the newest
  # version that installs on all three hosts.
  QT_VERSION: '6.10.3'

jobs:
  # Filters the build matrix by the workflow_dispatch "platforms" input so a
  # single platform can be rebuilt without repeating the finished ones.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select platforms
        id: select
        shell: bash
        run: |
          ALL='[
            {"name":"Linux (Ubuntu 22.04, glibc 2.35 baseline)","os":"ubuntu-22.04","qt_arch":"linux_gcc_64","key":"linux"},
            {"name":"macOS (universal)","os":"macos-15","qt_arch":"clang_64","key":"macos"},
            {"name":"Windows (VS 2022)","os":"windows-latest","qt_arch":"win64_msvc2022_64","key":"windows"}
          ]'
          SEL='${{ inputs.platforms }}'
          if [ -z "$SEL" ] || [ "$SEL" = "all" ]; then
            MATRIX=$(echo "$ALL" | jq -c .)
          else
            MATRIX=$(echo "$ALL" | jq -c --arg sel "$SEL" '[.[] | select(.key as $k | $sel | contains($k))]')
          fi
          echo "Selected platforms: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The single source of truth for the application version is the
      # project() VERSION in CMakeLists.txt; artifacts embed it.
      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]/{print $2; exit}' CMakeLists.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            fuse \
            libfuse2

      # App Store submissions must be built against a current SDK, so select
      # the newest stable Xcode on the runner instead of the image default.
      - name: Select latest stable Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja freetype fontconfig

      # Homebrew bottles are single-arch, and FreeType is OCCT's only external
      # font dependency. Rebuild it as a universal (arm64+x86_64) dylib in
      # place of the Homebrew copy so a universal OCCT/app can link its x86_64
      # slice; OCCT's detection and macdeployqt's bundling are unchanged. Built
      # to match the Homebrew version so the soname (libfreetype.6.dylib) lines
      # up with what OCCT links and macdeployqt relocates.
      - name: Rebuild FreeType as universal (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          FTV=$(brew list --versions freetype | awk '{print $2}')
          echo "Rebuilding FreeType $FTV as universal in $(brew --prefix freetype)"
          # Savannah's primary download host returns 502 often enough to have
          # cost a release, so its mirror alias and SourceForge are tried after
          # it. All three serve the identical release tarball, unpacking to the
          # same freetype-$FTV directory. Downloaded to a file rather than
          # piped into tar, so a mirror handing back an HTML error page is
          # caught by gzip -t instead of half-extracting.
          TARBALL="$RUNNER_TEMP/freetype-${FTV}.tar.gz"
          for url in \
            "https://download.savannah.gnu.org/releases/freetype/freetype-${FTV}.tar.gz" \
            "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-${FTV}.tar.gz" \
            "https://downloads.sourceforge.net/freetype/freetype-${FTV}.tar.gz"
          do
            echo "Trying $url"
            if curl -fsSL --retry 3 --retry-delay 5 -o "$TARBALL" "$url" \
               && gzip -t "$TARBALL"; then
              echo "Fetched FreeType $FTV from $url"
              break
            fi
            rm -f "$TARBALL"
          done
          if [ ! -f "$TARBALL" ]; then
            echo "::error::could not download FreeType $FTV from any mirror"
            exit 1
          fi
          tar xzf "$TARBALL" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/freetype-${FTV}" -B "$RUNNER_TEMP/ft-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="$(brew --prefix freetype)" \
            -DCMAKE_INSTALL_NAME_DIR="$(brew --prefix freetype)/lib" \
            -DFT_DISABLE_HARFBUZZ=ON -DFT_DISABLE_BROTLI=ON \
            -DFT_DISABLE_BZIP2=ON -DFT_DISABLE_PNG=ON
          cmake --build "$RUNNER_TEMP/ft-build" --target install
          # FreeType's CMake stamps an @rpath install name (MACOSX_RPATH), but
          # the build-tree binaries have no rpath entry for it, so OCCT and the
          # test executables cannot find it. Force the absolute install name
          # Homebrew used, so OCCT records a resolvable path (macdeployqt still
          # rewrites it to @loader_path when bundling).
          FT_LIB="$(brew --prefix freetype)/lib/libfreetype.6.dylib"
          install_name_tool -id "$FT_LIB" "$FT_LIB"
          echo "== FreeType id + architectures now =="
          otool -D "$FT_LIB"
          lipo -archs "$FT_LIB"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true
          cache-key-prefix: qt-${{ matrix.os }}

      # Open CASCADE 8.0 is newer than any distro or Homebrew package. On
      # Linux/macOS it is built from source once and cached; restore and
      # save are split so a long OCCT build is banked even when a later
      # step in the job fails.
      - name: Cache Open CASCADE (restore)
        if: runner.os != 'Windows'
        id: occt-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/occt-install
          key: occt-${{ env.OCCT_TAG }}-${{ matrix.os }}-v5

      # The project builds with Ninja + MSVC in CI (the "windows" preset's
      # VS 2022 generator is for local use; the windows-latest image no
      # longer ships that Visual Studio version).
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Windows uses the official prebuilt vc14-64 binaries instead of a
      # ~50-minute MSVC source build. The third-party runtime DLLs
      # (freetype, FreeImage, ffmpeg, tbb, jemalloc, ...) are merged into
      # the OCCT bin directory, where the project's runtime-deployment
      # step picks up exactly the ones the toolkits import.
      - name: Install Open CASCADE prebuilt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = "$env:RUNNER_TEMP".Replace('\', '/')
          curl.exe -fsSL -o "$tmp/occt-combined.zip" `
            "https://github.com/Open-Cascade-SAS/OCCT/releases/download/$env:OCCT_TAG/occt-combined-release-no-pch.zip"
          tar -xf "$tmp/occt-combined.zip" -C "$env:RUNNER_TEMP"
          $inner = (Get-ChildItem "$env:RUNNER_TEMP" -Filter 'opencascade-*-combined.zip')[0].FullName
          New-Item -ItemType Directory "$tmp/occt-prebuilt" | Out-Null
          tar -xf "$inner" -C "$tmp/occt-prebuilt"
          $root = (Get-ChildItem "$tmp/occt-prebuilt" -Directory -Filter 'opencascade-*')[0].FullName
          $bin = "$root/win64/vc14/bin"
          # The 3rdparty tree carries debug variants under debug\bin whose
          # names collide with the release DLLs (jemalloc.dll links
          # VCRUNTIME140D, which end users do not have) — exclude them.
          Get-ChildItem "$tmp/occt-prebuilt/3rdparty-*" -Recurse -Filter *.dll |
            Where-Object { $_.FullName -notmatch '\\debug\\' } |
            Copy-Item -Destination $bin -Force
          "LEP_OCCT_ROOT=$($root.Replace('\', '/'))" >> $env:GITHUB_ENV

      - name: Build Open CASCADE
        if: runner.os != 'Windows' && steps.occt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL "https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/${OCCT_TAG}.tar.gz" | tar xz -C "$RUNNER_TEMP"
          # Universal (arm64 + x86_64) OCCT with a deployment target a few
          # releases back, so its libraries match the app and do not drag the
          # minimum macOS version up. Links the universal FreeType installed
          # over Homebrew's in an earlier step.
          EXTRA=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                    -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0)
          fi
          cmake -S "$RUNNER_TEMP"/OCCT-* -B "$RUNNER_TEMP/occt-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "${EXTRA[@]}" \
            -DINSTALL_DIR="$RUNNER_TEMP/occt-install" \
            -DCMAKE_INSTALL_RPATH='$ORIGIN;@loader_path' \
            -DBUILD_MODULE_Draw=OFF \
            -DBUILD_MODULE_DETools=OFF \
            -DUSE_TK=OFF \
            -DUSE_TCL=OFF \
            -DBUILD_DOC_Overview=OFF
          cmake --build "$RUNNER_TEMP/occt-build" --target install

      - name: Cache Open CASCADE (save)
        if: runner.os != 'Windows' && steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/occt-install
          key: occt-${{ env.OCCT_TAG }}-${{ matrix.os }}-v5

      - name: Configure
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # macOS emits a universal (arm64+x86_64) binary; the deployment
          # target is set in CMakeLists.txt. Other platforms build host-native.
          EXTRA=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64")
          fi
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "${EXTRA[@]}" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/occt-install;$QT_ROOT_DIR"

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build-ci

      # The OpenGL viewport tests need a real display; everything else —
      # engine runs, preprocessor parity, preset calculation, headless CLI —
      # runs offscreen.
      - name: Test
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-ci --output-on-failure -E "gui_smoke|studio_model_smoke"

      # Windows builds with Ninja + the runner's MSVC (windeployqt + OCCT
      # runtime deployment run as post-build steps exactly as locally), and
      # additionally runs the Fortran byte-compare reference test.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qt = "$env:QT_ROOT_DIR".Replace('\', '/')
          cmake -S . -B build-ci -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$qt" `
            "-DLEP_OCCT_ROOT=$env:LEP_OCCT_ROOT"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build-ci

      # A missing DLL on Windows can surface as an invisible loader dialog
      # that hangs the process forever, so probe the engine directly with a
      # hard timeout and print its import table before running the suite.
      - name: Preflight engine (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          Get-ChildItem build-ci/bin/Release -Filter *.dll | ForEach-Object Name
          dumpbin /dependents build-ci\bin\Release\leparagliding-engine.exe
          $p = Start-Process -FilePath build-ci\bin\Release\leparagliding-engine.exe `
            -ArgumentList '--help' -PassThru -NoNewWindow -Wait:$false
          if (-not $p.WaitForExit(60000)) {
            Write-Host '::error::engine --help hung for 60s'
            $p | Stop-Process -Force
            exit 1
          }
          Write-Host "engine --help exit code: $($p.ExitCode)"

      - name: Test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-ci --output-on-failure -E "gui_smoke|studio_model_smoke"

      # ---- Packaging: every push builds versioned artifacts; a v* tag (or
      # ---- a manual dispatch with upload_to_release) attaches them to the
      # ---- GitHub release.

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build-ci/bin/Release/LEparagliding AppDir/usr/bin/
          cp build-ci/bin/Release/leparagliding-engine AppDir/usr/bin/
          cp -R build-ci/bin/Release/presets AppDir/usr/bin/presets
          cp resources/linux/leparagliding.desktop AppDir/usr/share/applications/
          cp resources/linux/leparagliding.png AppDir/usr/share/icons/hicolor/256x256/apps/
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/LEparagliding \
            --executable AppDir/usr/bin/leparagliding-engine \
            --plugin qt --output appimage
          mv LEparagliding*-x86_64.AppImage "LEparagliding_v${{ steps.version.outputs.version }}_linux-x86_64.AppImage"

      # macOS signing activates when the Developer ID secrets are present
      # (same names as in the Decenza repo); without them the DMG ships
      # unsigned and Gatekeeper users right-click > Open the first time.
      - name: Install Apple Developer ID certificate (macOS)
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          P12_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/developer_id_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$P12_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          APP=build-ci/bin/Release/LEparagliding.app
          cp build-ci/bin/Release/leparagliding-engine "$APP/Contents/MacOS/"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" \
            -executable="$APP/Contents/MacOS/leparagliding-engine" -verbose=1

      # Hardened runtime + deep signing covers the bundled engine and all
      # deployed Qt/OCCT libraries; required for notarization.
      - name: Sign the app (macOS)
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          APP=build-ci/bin/Release/LEparagliding.app
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/app-signing.keychain-db"
          codesign --deep --force --options runtime \
            --sign "Developer ID Application: Michael Holm (HKHN2RK2P4)" \
            "$APP"
          codesign --verify --strict "$APP"

      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg_contents
          cp -R build-ci/bin/Release/LEparagliding.app dmg_contents/
          ln -s /Applications dmg_contents/Applications
          hdiutil create -volname "LEparagliding" -srcfolder dmg_contents \
            -ov -format UDZO \
            "LEparagliding_v${{ steps.version.outputs.version }}_macos-universal.dmg"

      - name: Sign, notarize, and staple the DMG (macOS)
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_APP_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="LEparagliding_v${{ steps.version.outputs.version }}_macos-universal.dmg"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/app-signing.keychain-db"
          codesign --force --sign "Developer ID Application: Michael Holm (HKHN2RK2P4)" "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Cleanup signing keychain (macOS)
        if: ${{ always() && runner.os == 'macOS' }}
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

      # The Release output folder is already self-contained (windeployqt +
      # OCCT runtime + presets), so the Windows artifact is a plain zip. The
      # signed installer remains the local installer/build_installer.ps1 flow.
      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build-ci/bin/Release/* -DestinationPath `
            "LEparagliding_v${{ steps.version.outputs.version }}_winx64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: LEparagliding-${{ matrix.os }}
          path: LEparagliding_v*
          retention-days: 7
          overwrite: true

      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_to_release == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${{ steps.version.outputs.version }}"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "LEparagliding $TAG" --generate-notes || true
          fi
          gh release upload "$TAG" LEparagliding_v* --clobber
