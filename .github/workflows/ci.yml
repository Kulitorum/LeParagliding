name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Upload artifacts to the GitHub release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OCCT_TAG: V8_0_0_p1
  # Needs Qt >= 6.9: older QtGui link interfaces reference the AGL framework,
  # which the macOS 26 SDK (selected via latest-stable Xcode) no longer
  # ships. 6.11.1 is not yet resolvable by aqtinstall for windows desktop
  # (its base Updates.xml is missing from the CDN), so pin the newest
  # version that installs on all three hosts.
  QT_VERSION: '6.10.3'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Ubuntu 24.04)
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - name: macOS 15 (arm64)
            os: macos-15
            qt_arch: clang_64
          - name: Windows (VS 2022)
            os: windows-latest
            qt_arch: win64_msvc2022_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The single source of truth for the application version is the
      # project() VERSION in CMakeLists.txt; artifacts embed it.
      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]/{print $2; exit}' CMakeLists.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            fuse \
            libfuse2

      # App Store submissions must be built against a current SDK, so select
      # the newest stable Xcode on the runner instead of the image default.
      - name: Select latest stable Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja freetype fontconfig

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true
          cache-key-prefix: qt-${{ matrix.os }}

      # Open CASCADE 8.0 is newer than any distro or Homebrew package, so it
      # is built from source once per OCCT tag and cached as an install tree.
      - name: Cache Open CASCADE
        id: occt-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/occt-install
          key: occt-${{ env.OCCT_TAG }}-${{ matrix.os }}-v1

      # OCCT links freetype; on Windows it comes from vcpkg and its DLLs are
      # dropped into the OCCT install tree so they travel with the cache.
      - name: Install freetype via vcpkg (Windows)
        if: runner.os == 'Windows' && steps.occt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: vcpkg install freetype:x64-windows

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows' && steps.occt-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Open CASCADE (Windows)
        if: runner.os == 'Windows' && steps.occt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -fsSL "https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/$env:OCCT_TAG.tar.gz" -o "$env:RUNNER_TEMP\occt.tar.gz"
          tar -xzf "$env:RUNNER_TEMP\occt.tar.gz" -C "$env:RUNNER_TEMP"
          $src = (Get-ChildItem "$env:RUNNER_TEMP" -Directory -Filter 'OCCT-*')[0].FullName.Replace('\', '/')
          $tmp = "$env:RUNNER_TEMP".Replace('\', '/')
          cmake -S "$src" -B "$tmp/occt-build" -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DINSTALL_DIR="$tmp/occt-install" `
            -DINSTALL_DIR_LAYOUT=Unix `
            -D3RDPARTY_FREETYPE_DIR='C:/vcpkg/installed/x64-windows' `
            -DBUILD_MODULE_Draw=OFF `
            -DBUILD_MODULE_DETools=OFF `
            -DUSE_TK=OFF `
            -DUSE_TCL=OFF `
            -DBUILD_DOC_Overview=OFF
          cmake --build "$tmp/occt-build" --target install
          Copy-Item 'C:/vcpkg/installed/x64-windows/bin/*.dll' "$tmp/occt-install/bin/"

      - name: Build Open CASCADE
        if: runner.os != 'Windows' && steps.occt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL "https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/${OCCT_TAG}.tar.gz" | tar xz -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP"/OCCT-* -B "$RUNNER_TEMP/occt-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DINSTALL_DIR="$RUNNER_TEMP/occt-install" \
            -DCMAKE_INSTALL_RPATH='$ORIGIN;@loader_path' \
            -DBUILD_MODULE_Draw=OFF \
            -DBUILD_MODULE_DETools=OFF \
            -DUSE_TK=OFF \
            -DUSE_TCL=OFF \
            -DBUILD_DOC_Overview=OFF
          cmake --build "$RUNNER_TEMP/occt-build" --target install

      - name: Configure
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/occt-install;$QT_ROOT_DIR"

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build-ci

      # The OpenGL viewport tests need a real display; everything else —
      # engine runs, preprocessor parity, preset calculation, headless CLI —
      # runs offscreen.
      - name: Test
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-ci --output-on-failure -E "gui_smoke|studio_model_smoke"

      # Windows drives the same "windows" CMake preset developers use
      # locally (VS generator, windeployqt + OCCT runtime deployment), and
      # additionally runs the Fortran byte-compare reference test.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = "$env:RUNNER_TEMP".Replace('\', '/')
          $qt = "$env:QT_ROOT_DIR".Replace('\', '/')
          cmake --preset windows "-DCMAKE_PREFIX_PATH=$qt" "-DLEP_OCCT_ROOT=$tmp/occt-install"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build --preset release --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset release -E "gui_smoke|studio_model_smoke"

      # ---- Packaging: every push builds versioned artifacts; a v* tag (or
      # ---- a manual dispatch with upload_to_release) attaches them to the
      # ---- GitHub release.

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build-ci/bin/Release/LEparagliding AppDir/usr/bin/
          cp build-ci/bin/Release/leparagliding-engine AppDir/usr/bin/
          cp -R build-ci/bin/Release/presets AppDir/usr/bin/presets
          cp resources/linux/leparagliding.desktop AppDir/usr/share/applications/
          cp resources/linux/leparagliding.png AppDir/usr/share/icons/hicolor/256x256/apps/
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/LEparagliding \
            --executable AppDir/usr/bin/leparagliding-engine \
            --plugin qt --output appimage
          mv LEparagliding*-x86_64.AppImage "LEparagliding_v${{ steps.version.outputs.version }}_linux-x86_64.AppImage"

      # Unsigned for now: signing/notarization needs Apple Developer ID
      # secrets; Gatekeeper users right-click > Open the first time.
      - name: Package (macOS DMG)
        if: runner.os == 'macOS'
        run: |
          APP=build-ci/bin/Release/LEparagliding.app
          cp build-ci/bin/Release/leparagliding-engine "$APP/Contents/MacOS/"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" \
            -executable="$APP/Contents/MacOS/leparagliding-engine" -verbose=1
          mkdir dmg_contents
          cp -R "$APP" dmg_contents/
          ln -s /Applications dmg_contents/Applications
          hdiutil create -volname "LEparagliding" -srcfolder dmg_contents \
            -ov -format UDZO \
            "LEparagliding_v${{ steps.version.outputs.version }}_macos-arm64.dmg"

      # The Release output folder is already self-contained (windeployqt +
      # OCCT runtime + presets), so the Windows artifact is a plain zip. The
      # signed installer remains the local installer/build_installer.ps1 flow.
      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/bin/Release/* -DestinationPath `
            "LEparagliding_v${{ steps.version.outputs.version }}_winx64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: LEparagliding-${{ matrix.os }}
          path: LEparagliding_v*
          retention-days: 7
          overwrite: true

      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_to_release == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${{ steps.version.outputs.version }}"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "LEparagliding $TAG" --generate-notes || true
          fi
          gh release upload "$TAG" LEparagliding_v* --clobber
